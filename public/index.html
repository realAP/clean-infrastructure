<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clean Infrastructure – CI/CD Demo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --ok: #4ade80;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card {
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem 3rem;
      max-width: 34rem;
      box-shadow: 0 20px 60px rgb(0 0 0 / 0.4);
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.6rem; }
    .subtitle { color: var(--muted); margin: 0 0 2rem; }
    .pipeline {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      font-size: 0.85rem;
    }
    .stage {
      background: #0f172a;
      border: 1px solid var(--ok);
      color: var(--ok);
      border-radius: 8px;
      padding: 0.4rem 0.8rem;
      white-space: nowrap;
    }
    .arrow { color: var(--muted); }
    dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.5rem 1.5rem;
      margin: 0;
    }
    dt { color: var(--muted); }
    dd {
      margin: 0;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--accent);
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🚀 Clean Infrastructure Demo</h1>
    <p class="subtitle">Dieses Artefakt wurde von der CI/CD-Pipeline gebaut und ausgeliefert.</p>
    <p> Hi, was geht ab.</p>

    <div class="pipeline" aria-hidden="true">
      <span class="stage">Lint</span>
      <span class="arrow">→</span>
      <span class="stage">Test</span>
      <span class="arrow">→</span>
      <span class="stage">Build Image</span>
      <span class="arrow">→</span>
      <span class="stage">Push</span>
    </div>

    <dl id="info">
      <dt>Version</dt><dd id="version">…</dd>
      <dt>Commit</dt><dd id="commit">…</dd>
      <dt>Gebaut am</dt><dd id="builtAt">…</dd>
      <dt>Node</dt><dd id="node">…</dd>
    </dl>
  </main>

  <script>
    fetch('/api/info')
      .then((res) => res.json())
      .then((info) => {
        document.getElementById('version').textContent = info.version;
        document.getElementById('commit').textContent = info.commit;
        document.getElementById('builtAt').textContent = info.builtAt ?? 'lokaler Build';
        document.getElementById('node').textContent = info.node;
      })
      .catch(() => {
        document.getElementById('info').textContent = 'Build-Info nicht erreichbar.';
      });
  </script>
</body>
</html>
