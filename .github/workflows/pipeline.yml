# ===========================================================================
# CI/CD-Pipeline für die Vorlesung "Clean Infrastructure"
#
# Aufbau nach dem klassischen CI/CD-Stufenmodell
# (https://github.com/resources/articles/ci-cd):
#
#   Continuous Integration                 Continuous Delivery
#   ┌───────┐   ┌──────┐   ┌──────────┐   ┌────────────────────┐
#   │ Build │──▶│ Test │──▶│ Artifact │──▶│ Deliver (ghcr.io)  │
#   └───────┘   └──────┘   └──────────┘   └────────────────────┘
#
# Pull Requests durchlaufen nur die CI (Build → Test → Artifact).
# Die Delivery verpackt das CI-Artefakt in ein Docker-Image und pusht
# es – welche Tags es bekommt, hängt am Git-Ereignis:
#
#   Push auf main → dev, sha-…                       (Entwicklungsstand)
#   Tag v1.2.3    → 1.2.3, 1.2, 1, latest, sha-…     (Release)
#
# dev ist bewusst NICHT latest: latest zeigt immer auf das letzte
# Release, dev auf den aktuellen Stand von main.
#
# Ausgeliefert wird immer das CI-Artefakt (app-bundle): Was getestet
# wurde, wird verpackt – die CD baut nichts neu.
# ===========================================================================
name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- Continuous Integration -------------------------------------------
  build:
    name: "CI · Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Node hat keinen Compile-Schritt – "bauen" heißt hier: Dependencies
      # exakt nach Lockfile auflösen und installieren. Bei kompilierten
      # Sprachen stünde an dieser Stelle javac/tsc/go build.
      - name: Dependencies installieren
        run: npm ci

  test:
    name: "CI · Test"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Statische Analyse (Lint)
        run: npm run lint
      - name: Tests
        run: npm test

  artifact:
    name: "CI · Artifact"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Das Artefakt: App-Code + Produktions-Dependencies, ohne Dev-Kram.
      # Genau dieses Bundle wird später von der Delivery verpackt.
      - name: Artefakt bauen
        run: |
          npm ci --omit=dev
          tar -czf app-bundle.tgz package.json node_modules src public
      - name: Artefakt veröffentlichen
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: app-bundle.tgz
          retention-days: 7

  # --- Continuous Delivery ----------------------------------------------
  # Eine Stage für alles: Sie verpackt das CI-Artefakt und pusht das
  # Image. Nur die Tags unterscheiden sich je nach Git-Ereignis
  # (siehe "Image-Tags ableiten").
  deliver:
    name: "CD · Deliver"
    runs-on: ubuntu-latest
    needs: artifact
    if: github.event_name == 'push' # main-Push oder Versions-Tag, kein PR
    permissions:
      contents: read
      packages: write # erlaubt den Push nach ghcr.io via GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v5

      - name: CI-Artefakt laden
        uses: actions/download-artifact@v4
        with:
          name: app-bundle
      - name: Artefakt entpacken
        run: tar -xzf app-bundle.tgz

      - uses: docker/setup-buildx-action@v3

      - name: Login bei der GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagging-Strategie:
      #   Push auf main → dev (wandernder Entwicklungsstand, NICHT latest)
      #   Tag v1.2.3    → Semver-Kaskade 1.2.3 / 1.2 / 1 + latest
      #   immer         → sha-<commit> (exakt dieser Build)
      - name: Image-Tags & Labels ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha

      - name: Build-Zeitpunkt festhalten
        id: build-time
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Image verpacken und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build-time.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
