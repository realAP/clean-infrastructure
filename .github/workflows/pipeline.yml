# ===========================================================================
# CI/CD-Pipeline für die Vorlesung "Clean Infrastructure"
#
#   ┌──────┐
#   │ Lint │──┐
#   └──────┘  │    ┌──────────────────────┐
#             ├───▶│ Deliver:             │
#   ┌──────┐  │    │ Docker Build & Push  │
#   │ Test │──┘    └──────────────────────┘
#   └──────┘
#
# Continuous Integration (lint, test):
#   läuft bei JEDEM Push und JEDEM Pull Request.
#
# Continuous Delivery (deliver):
#   baut das Artefakt (npm ci --omit=dev) und verpackt es in ein
#   Docker-Image – das Dockerfile selbst führt keine Build-Schritte aus.
#   Gebaut wird immer (validiert den Ablauf auch im PR), gepusht nur bei
#   Push auf main oder bei einem Versions-Tag.
#   Artefakt-Registry: GitHub Container Registry (ghcr.io).
# ===========================================================================
name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ["v*.*.*"] # Release-Tags wie v1.2.3 lösen die Semver-Tags aus
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- Continuous Integration -------------------------------------------
  lint:
    name: "CI · Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: "CI · Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # --- Continuous Delivery ----------------------------------------------
  deliver:
    name: "CD · Docker Build & Push"
    runs-on: ubuntu-latest
    needs: [lint, test] # erst ausliefern, wenn die CI grün ist
    permissions:
      contents: read
      packages: write # erlaubt den Push nach ghcr.io via GITHUB_TOKEN

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Hier entsteht das Artefakt: App-Code + Produktions-Dependencies.
      # Das Dockerfile baut nichts mehr selbst, es verpackt nur noch.
      - name: Artefakt bauen (Produktions-Dependencies)
        run: npm ci --omit=dev

      - uses: docker/setup-buildx-action@v3

      - name: Login bei der GitHub Container Registry
        # Im PR wird nicht gepusht, also ist auch kein Login nötig.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Hier passiert die Tagging-Magie. Aus dem Git-Kontext werden
      # automatisch die passenden Image-Tags abgeleitet:
      #
      #   Push auf main      → main, sha-<commit>, latest
      #   Git-Tag v1.2.3     → 1.2.3, 1.2, 1, sha-<commit>, latest
      #   Pull Request #7    → pr-7 (nur Probe-Build, kein Push)
      - name: Image-Tags & Labels ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build-Zeitpunkt festhalten
        id: build-time
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Docker-Image bauen (und pushen)
        uses: docker/build-push-action@v6
        with:
          context: .
          # Im PR nur bauen (Dockerfile validieren), nicht ausliefern:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build-time.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
